name: relaunch-pipeline-tests

on:
  push:
    branches: [main]
  pull_request:


jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -e ".[dev]" && python -m playwright install --with-deps chromium
      - run: npm ci --no-audit --no-fund
        working-directory: site
      - run: python -m pytest -q
