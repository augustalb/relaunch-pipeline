[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "relaunch-pipeline"
version = "0.1.0"
description = "Autonomous outreach pipeline: finds local businesses with outdated websites, builds a better preview and sends a personalised cold email."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "typer>=0.12",
    "rich>=13",
    "jinja2>=3.1",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "pyyaml>=6",
    "dnspython>=2.6",
    "python-dotenv>=1.0",
    "anthropic>=0.40",
    "playwright>=1.45",
    "python-multipart>=0.0.9",
    "pillow>=10",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
dev = ["pytest>=8", "pytest-timeout>=2.3"]

[project.scripts]
pipeline = "pipeline.cli:app"

[tool.setuptools.packages.find]
include = ["pipeline*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
timeout = 600
